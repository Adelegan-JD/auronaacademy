<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1400" role="img" aria-labelledby="title desc">
<title id="title">Students learning together</title><desc id="desc">An illustration of two students studying together at a desk with books and a laptop.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#eaf1ec"/><stop offset="1" stop-color="#d8e7e1"/></linearGradient>
 <linearGradient id="window" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#d8e9e9"/><stop offset="1" stop-color="#f7f4e9"/></linearGradient>
 <linearGradient id="navy" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#203e60"/><stop offset="1" stop-color="#142d4e"/></linearGradient>
 <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#2b8278"/><stop offset="1" stop-color="#176b68"/></linearGradient>
 <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#142d4e" flood-opacity=".16"/></filter>
</defs>
